<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Fondo con bordes redondeados y gradiente -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>
  <!-- Ícono Altavoz Blanco Centrado con Ondas de Sonido -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(6, 4)">
    <!-- Cuerpo del altavoz -->
    <path d="M12 21 H19 L30 11 V41 L19 31 H12 C10.9 31 10 30.1 10 29 V23 C10 21.9 10.9 21 12 21 Z"/>
    <!-- Onda pequeña -->
    <path d="M34 20 C35.8 22.1 36.8 24.5 36.8 26 C36.8 27.5 35.8 29.9 34 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Onda grande -->
    <path d="M39 15 C42.2 18.5 44 22.5 44 26 C44 29.5 42.2 33.5 39 37" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
